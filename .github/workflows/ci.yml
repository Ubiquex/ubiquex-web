name: ci

# There was no PR check here at all, and the reason is worth recording.
#
# This repo had a "Deploy to GitHub Pages" workflow in deploy.yml. The
# CloudFront deploy workflow was added under the same filename, so it
# REPLACED the Pages one rather than sitting beside it. Neither ever ran
# on a pull request: both trigger on push to main. So every PR merged
# with no check having run.
#
# That is how a lockfile mismatch reached main: package.json was bumped
# to a new @ubx/docs-ui minor while the lockfile kept its old pin, and
# nothing ran `npm ci` until the deploy did, after the merge.
#
# Deliberately does NOT duplicate deploy.yml. This runs the things that
# can be checked without credentials; deploy.yml keeps its own guards for
# the things that only matter at deploy time.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The base branch is main, enforced rather than asked.
      #
      # TRAPS.md's own "a stacked PR is only safe while its base is
      # unmerged" trap. A PR based on another branch merges into THAT
      # branch. GitHub retargets it when the base lands on main, but
      # only if it gets there first, and twice in ubiquex it did not:
      # the dependent PR merged into an already-dead base seconds
      # later, showed MERGED, and its content never reached main.
      #
      # stale-base-check (where this org has it) asks the narrower
      # question, whether the base is ALREADY merged, and it is a real
      # guard. It cannot catch this shape though: it triggers on
      # pull_request opened/synchronize/reopened, so it evaluates when
      # the PR is pushed and never at the moment the merge button is
      # clicked, which is the one moment the trap fires. A PR opened
      # while its base was healthy stays green through the base
      # merging out from under it.
      #
      # This question does not depend on when it is asked. The base is
      # main or it is not, and that cannot change between opening and
      # merging except by retargeting, which only moves it toward main.
      #
      # It lives inside a job branch protection already requires, so a
      # stacked PR cannot merge rather than merely being discouraged,
      # and no branch-protection change was needed to add it.
      - name: The base branch is main
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$BASE" = "main" ]; then
            echo "base is main"
            exit 0
          fi
          {
            echo "This PR targets \"$BASE\", not main."
            echo
            echo "A PR based on another branch merges into THAT branch. If the base"
            echo "reaches main first, this PR merges into a dead branch, reports MERGED,"
            echo "and its content never lands. Nothing tells that apart from a real merge"
            echo "except an explicit ancestry check after the fact."
            echo
            echo "Branch from main and open this against main. If it genuinely depends on"
            echo "unmerged work, wait for that to land and rebase onto main:"
            echo
            echo "    git rebase --onto main <old-base> <this-branch>"
            echo
            echo "If a non-main base is ever genuinely right in this repo, change this step"
            echo "deliberately, in its own reviewed PR, rather than working around it."
          } >&2
          exit 1

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # npm ci, not npm install: it fails on a package.json/lockfile
      # mismatch instead of silently resolving one, which is the exact
      # failure this workflow exists to catch before merge.
      - run: npm ci

      - run: npm run typecheck
      - name: CloudFront rewrite function tests
        # Plain node, no AWS. Reads infra/cloudfront/rewrite.js itself, so
        # what is tested is the exact bytes that get uploaded.
        run: npm test
      - name: Distribution config is within CloudFront's limits
        run: node infra/check-distribution-config.mjs
      - run: npm run build

      - name: Confirm the export actually produced pages
        run: |
          set -euo pipefail
          test -f out/index.html || { echo "out/index.html missing"; exit 1; }
          n="$(find out -name '*.html' | wc -l | tr -d ' ')"
          echo "exported HTML pages: $n"
          [ "$n" -ge 4 ] || { echo "only $n pages exported"; exit 1; }

      - name: Every exported page is small enough for CloudFront to compress
        # CloudFront silently declines to compress above 10,000,000 bytes,
        # so an oversized page ships raw with no error anywhere. UBI-243:
        # three pages did exactly that for months.
        run: npm run check:size
      - name: Every blog post is reachable from the blog index
        # The migrated post shipped with no route in from the footer, and
        # nothing noticed. A post that exists and cannot be reached is
        # the failure worth catching here.
        run: |
          set -euo pipefail
          fail=0
          for f in content/blog/*.mdx; do
            slug="$(basename "$f" .mdx)"
            grep -q "/blog/$slug" out/blog/index.html || { echo "not linked from the blog index: $slug"; fail=1; }
            test -f "out/blog/$slug/index.html" || { echo "no exported page: $slug"; fail=1; }
          done
          [ "$fail" -eq 0 ] && echo "every post is linked and exported"
          exit "$fail"
