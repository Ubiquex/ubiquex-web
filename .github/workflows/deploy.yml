name: deploy

# Replaces the GitHub Pages deployment. The site moves to the apex,
# ubiquex.io, on S3 behind CloudFront, matching both docs sites.
#
# paths-ignore is a deny-list, not an allow-list, for the same reason it
# is on the docs sites: an allow-list silently stops deploying anything
# it forgets, and a stale production site is worse than a wasted run.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "infra/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  BUCKET: ubiquex-web-site
  DISTRIBUTION_ID: E27DI3NROZ7508
  DEPLOY_ROLE: arn:aws:iam::839333509514:role/ubiquex-web-deploy
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run against placeholder infrastructure
        run: |
          set -euo pipefail
          missing=0
          for v in "$BUCKET" "$DISTRIBUTION_ID" "$DEPLOY_ROLE"; do
            case "$v" in REPLACE_ME*) missing=1;; esac
          done
          if [ "$missing" -eq 1 ]; then
            echo "Infrastructure identifiers are still placeholders. See infra/README.md."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Confirm the export actually produced pages
        run: |
          set -euo pipefail
          test -f out/index.html || { echo "out/index.html missing, refusing to sync"; exit 1; }
          n="$(find out -name '*.html' | wc -l | tr -d ' ')"
          echo "exported HTML pages: $n"
          [ "$n" -ge 4 ] || { echo "only $n pages, refusing to sync a likely-broken build"; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync immutable hashed assets
        run: |
          set -euo pipefail
          aws s3 sync out/ "s3://$BUCKET/" --exclude '*' --include '_next/static/*' \
            --cache-control 'public,max-age=31536000,immutable' --only-show-errors

      - name: Sync everything else
        run: |
          set -euo pipefail
          aws s3 sync out/ "s3://$BUCKET/" --exclude '_next/static/*' \
            --cache-control 'public,max-age=60' --delete --only-show-errors

      - name: Invalidate
        # A small, fully mutable marketing site: every page can change on
        # any deploy, so there is no immutable majority for a targeted
        # list to protect, and /* is one billable path rather than many.
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' --query 'Invalidation.Id' --output text

      - name: Confirm the site actually serves
        run: |
          set -euo pipefail
          d="$(aws cloudfront get-distribution --id "$DISTRIBUTION_ID" --query 'Distribution.DomainName' --output text)"
          fail=0
          for p in / /blog/ /blog/cross-stack-references/; do
            c="$(curl -s -o /dev/null -w '%{http_code}' "https://$d$p")"
            [ "$c" = "200" ] && echo "ok   $p" || { echo "FAIL $p -> $c"; fail=1; }
          done
          for p in /blog/tags/ubx/ /blog/ubx-public-preview/; do
            c="$(curl -s -o /dev/null -w '%{http_code}' "https://$d$p")"
            [ "$c" = "301" ] && echo "ok   $p redirects" || { echo "FAIL $p -> $c"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1
